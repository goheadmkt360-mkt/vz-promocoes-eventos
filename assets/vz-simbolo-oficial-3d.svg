<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 2048 2048" role="img" aria-labelledby="title desc">
  <title id="title">Símbolo oficial VZ 3D</title>
  <desc id="desc">Monograma VZ em forma de tubo metálico verde petróleo, com esfera lima e fundo transparente.</desc>
  <defs>
    <linearGradient id="tube" x1="0" y1="10" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#37A79A"/>
      <stop offset="0.16" stop-color="#238F84"/>
      <stop offset="0.48" stop-color="#167A73"/>
      <stop offset="0.78" stop-color="#0D6962"/>
      <stop offset="1" stop-color="#074F4B"/>
    </linearGradient>
    <linearGradient id="tube-depth" x1="0" y1="12" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#126A63"/>
      <stop offset="1" stop-color="#063F3C"/>
    </linearGradient>
    <linearGradient id="tube-glint" x1="0" y1="10" x2="0" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E3FFF4" stop-opacity="0.85"/>
      <stop offset="0.28" stop-color="#A8E2D5" stop-opacity="0.55"/>
      <stop offset="0.72" stop-color="#A8E2D5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#A8E2D5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lime-sphere" cx="30%" cy="24%" r="78%">
      <stop offset="0" stop-color="#F1F8C8"/>
      <stop offset="0.24" stop-color="#DDEB9B"/>
      <stop offset="0.62" stop-color="#C9DD73"/>
      <stop offset="1" stop-color="#91AC4D"/>
    </radialGradient>
    <radialGradient id="teal-cap" cx="30%" cy="25%" r="76%">
      <stop offset="0" stop-color="#53B8A9"/>
      <stop offset="0.38" stop-color="#22877E"/>
      <stop offset="1" stop-color="#0B5D58"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-35%" width="145%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.15" result="blur"/>
      <feOffset dy="1.3" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.24"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(166 529) scale(16.5)" filter="url(#soft-shadow)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 17 L30 43 L50 16 H92 L69 43 H88" fill="none" stroke="#073E3A" stroke-width="10.9" transform="translate(0 1.05)"/>
    <path d="M10 17 L30 43 L50 16 H92 L69 43 H88" fill="none" stroke="url(#tube-depth)" stroke-width="10.2" transform="translate(0 0.45)"/>
    <path d="M10 17 L30 43 L50 16 H92 L69 43 H88" fill="none" stroke="url(#tube)" stroke-width="10"/>
    <path d="M10 17 L30 43 L50 16 H92 L69 43 H88" fill="none" stroke="url(#tube-glint)" stroke-width="1.25" transform="translate(0 -2.7)"/>
    <circle cx="10" cy="17" r="4.95" fill="url(#teal-cap)"/>
    <circle cx="94" cy="43" r="6.35" fill="#6F8640" opacity="0.44" transform="translate(0.28 0.42)"/>
    <circle cx="94" cy="43" r="6.05" fill="url(#lime-sphere)" stroke="#8FA74C" stroke-width="0.24"/>
    <ellipse cx="92.6" cy="41.3" rx="1.1" ry="0.68" fill="#FFFFFF" opacity="0.48"/>
  </g>
</svg>
